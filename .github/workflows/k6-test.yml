name: K6 Load Test

on:
  push:
    branches: [ "feat/swagger-tester" ]

jobs:
  k6-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Team Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/team-load-test.js
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: Run Match Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/match-load-test.js
        env:
          TOKEN: ${{ secrets.TOKEN }}

