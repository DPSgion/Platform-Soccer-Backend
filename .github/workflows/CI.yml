name: Cupzone Backend CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Check code NodeJs
  test-code:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v6

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Run Unit Test
        env:
        
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

        run: npm test -- --forceExit

  # JOB 2: Check Docker build
  test-docker-build:
    runs-on: ubuntu-latest
    needs: test-code
    
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v6

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 3. Test Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          tags: cupzone-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 3: Run k6 load test
  k6-test:
    runs-on: ubuntu-latest
    needs: test-code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt update
          sudo apt install -y gnupg software-properties-common
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt update
          sudo apt install -y k6
          
      - name: Run k6 test
        run: |
          k6 run k6/team-load-test.js
        env:
          TOKEN: ${{ secrets.TOKEN }}