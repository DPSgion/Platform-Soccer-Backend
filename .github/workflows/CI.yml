name: Cupzone Backend CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Test API Integration & Load Test
  integration-and-load-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: cupzone_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v6

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Import Database Schema
        run: mysql -h 127.0.0.1 -u root -proot_password cupzone_test < database/init_schema.sql
        
      - name: 5. Start Backend & Wait
        run: |
          npm start &
          npx --yes wait-on tcp:3000 
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root_password
          DB_NAME: cupzone_test
          DB_PORT: 3306
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}

      - name: 6. Run API Integration Tests
        run: npm test -- --forceExit
        env:
          BASE_URL: 'http://localhost:3000'
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root_password
          DB_NAME: cupzone_test
          DB_PORT: 3306

      - name: 7. Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/team-load-test.js
        env:
          BASE_URL: 'http://localhost:3000'
          TOKEN: ${{ secrets.TOKEN }}


  # JOB 2: Check Docker build
  test-docker-build:
    runs-on: ubuntu-latest
    needs: integration-and-load-tests
    
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v6

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 3. Test Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          tags: cupzone-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max