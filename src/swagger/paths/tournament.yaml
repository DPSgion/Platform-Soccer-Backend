paths:

  /public/tournament:
    get:
      tags: [Public]
      summary: Get all tournaments
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentListResponse'
              example:
                success: true
                data:
                  - id: "1"
                    name: "Cupzone Tournament 2026"
                    logo_url: "https://picsum.photos/200/200"
                    description: "Giải đấu bóng đá mùa hè 2026"
                    format: "LEAGUE"
                    start_date: "2026-07-01"
                    end_date: "2026-07-20"
                    status: "UPCOMING"
                    organizer_id: "user_1"

        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /public/tournament/{id}/match:
    get:
      tags: [Public]
      summary: Get tournament matches
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"

      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentMatchesResponse'
              example:
                success: true
                data:
                  tournament:
                    id: "1"
                    name: "Cupzone Tournament 2026"
                    logo_url: "https://picsum.photos/200/200"
                    description: "Giải đấu bóng đá mùa hè 2026"
                    format: "LEAGUE"
                    start_date: "2026-07-01"
                    end_date: "2026-07-20"
                    status: "UPCOMING"
                    organizer_id: "user_1"
                  matches:
                    - id: "m1"
                      tournament_id: "1"
                      home_team: "Lions FC"
                      away_team: "Tigers FC"
                      home_score: 2
                      away_score: 1
                      stadium: "National Stadium"
                      start_time: "2026-07-05 18:00:00"

        500:
          description: Error (including not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Tournament not found"